  <g font-family="Consolas, 'Courier New', monospace">
    <text x="56" y="64" fill="#a8d1cc" font-size="17" letter-spacing="3">KLARENZ COBIE MANRIQUE</text>
    <text x="56" y="164" fill="#101d2b" font-size="92" font-weight="700" letter-spacing="-4">klacom</text>
    <text x="52" y="158" fill="#f2edd9" font-size="92" font-weight="700" letter-spacing="-4">klacom</text>
    <text x="56" y="208" fill="#cce0dd" font-size="24">Web, mobile &amp; games.</text>
    <path d="M56 230h36v4H56z" fill="#9bd075" shape-rendering="crispEdges"/>
  </g>
</svg>
