<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">klacom — web, mobile, and games</title>
  <desc id="desc">A handcrafted pixel landscape with drifting clouds, a grassy hill, a crystal cave, and Klarenz's pixel avatar. Inspired by his interactive portfolio.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#102238"/>
      <stop offset="1" stop-color="#224b63"/>
    </linearGradient>
    <pattern id="dirt" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#76503b"/>
      <path d="M0 0h48v4H0zM0 0h4v48H0z" fill="#8b6247"/>
      <path d="M44 4h4v44h-4zM4 44h40v4H4z" fill="#543a30"/>
      <path d="M9 12h8v4H9zM29 29h9v5h-9zM12 35h5v5h-5z" fill="#604232"/>
    </pattern>
    <pattern id="stone" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#28263e"/>
      <path d="M0 0h48v4H0zM0 0h4v48H0z" fill="#343149"/>
      <path d="M44 4h4v44h-4zM4 44h40v4H4zM12 13h12v4H12zM29 30h10v4H29z" fill="#1e1d31"/>
    </pattern>
    <g id="cloud" fill="#d0e5e5" opacity=".15" shape-rendering="crispEdges">
      <path d="M0 16h24V8h24V0h40v8h24v8h24v16H0z"/>
    </g>
  </defs>
  <style>
    .cloud-one { animation: drift 18s ease-in-out infinite; }
    .cloud-two { animation: drift 24s ease-in-out infinite reverse; }
    .spark { animation: twinkle 5s ease-in-out infinite; }
    .spark-late { animation-delay: -2.5s; }
    @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(24px); } }
    @keyframes twinkle { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cloud-one,.cloud-two,.spark { animation: none; } }
  </style>

  <rect width="1200" height="340" fill="url(#sky)"/>
  <g shape-rendering="crispEdges">
    <g fill="#c6e6e0" opacity=".45">
      <path d="M590 38h3v3h-3zM738 57h3v3h-3zM1034 31h3v3h-3zM1130 93h3v3h-3z"/>
      <path d="M840 26h3v3h-3zM643 101h3v3h-3zM1082 151h3v3h-3z"/>
    </g>
    <g class="cloud-one"><use href="#cloud" x="690" y="80"/></g>
    <g class="cloud-two"><use href="#cloud" x="1000" y="42"/></g>

    <path d="M650 240v-40h48v-32h48v-32h48v32h48v32h48v-48h48v-32h48v32h48v48h48v-32h48v-24h48v24h24v72z" fill="#2b5961"/>
