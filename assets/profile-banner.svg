    <g class="spark" fill="#cdb6ff"><path d="M111 304h3v-3h3v3h3v3h-3v3h-3v-3h-3z"/></g>
    <g class="spark spark-late" fill="#b4edd0"><path d="M1014 176h3v-3h3v3h3v3h-3v3h-3v-3h-3z"/></g>

